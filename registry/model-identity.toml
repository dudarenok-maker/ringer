# ---------------------------------------------------------------------------
# The Open Engine worker lanes on this box. SIX engine keys here are the SAME
# Cline runtime on six CONCURRENTLY AVAILABLE routes - not a succession, six
# live budgets - which is exactly why `access` is the column that separates
# them. Harness is identical for all six; only the route differs, so nothing
# else in the row can tell them apart.
#
#   cline             Cline Pass, prepaid balance
#   cline-free        Cline free tier, hard daily quota
#   cline-glm         glm-5.2 on BytePlus ARK, Lite package
#   cline-qwen-cloud  qwen3.7-max on the operator's Alibaba MaaS token plan
#   cline-qwen-local  qwen38-agent-iq4-96k on this box's own GPUs (llama.cpp/llama-swap), unmetered
#   cline-muse-local  muse-glimmer-agent-96k on the same GPUs (llama.cpp/llama-swap), unmetered
#
# Access values are operator-confirmed: the first three 2026-08-18, the qwen
# cloud route 2026-08-20.
#
# THE CONFIDENCE SPLIT IS NOT ARBITRARY. The three metered slugs are NOT marked
# verified - no lab source has been checked for them, and the taxonomy forbids
# promoting a slug-derived identity without one. The two LOCAL slugs ARE
# verified, because an Ollama tag can be probed on the box for its parent model
# and manifest; each cites the copilot-* entry that did that probing, since one
# tag driven by two harnesses is one identity, not two.
#
# ONE CELL HERE IS A DEFAULT, NOT A FACT: an unattributed legacy row has no
# model, so it resolves through the ENGINE block and inherits that engine's
# access. For `cline` that prints "Cline Pass", and the one such row (2026-08-14)
# predates the 2026-08-16 correction that pointed this engine at the pass
# provider - so it most likely ran the free route. The row is already marked
# unattributed and not ranked; do not read its API/Plan cell as evidence of what
# it cost.
# ---------------------------------------------------------------------------

[engines.claude]
harness = "Claude Code"
access = "Max 20x plan"          # operator-confirmed 2026-08-18
default_model_key = "claude-sonnet-5"

[engines.claude.models."claude-sonnet-5"]
display = "Claude Sonnet 5"
lab = "Anthropic"
confidence = "verified"     # pinned on the command line via --model, so the recorded slug is true by construction
source = "~/.config/ringer/config.toml [engines.claude] args_template"
last_verified = 2026-08-18

[engines.cline]
harness = "Cline CLI"
access = "Cline Pass"            # operator-confirmed 2026-08-18; prepaid balance
default_model_key = "cline-pass/deepseek-v4-flash"

[engines.cline.models."cline-pass/deepseek-v4-flash"]
display = "DeepSeek V4 Flash"
lab = "DeepSeek"
confidence = "unverified"   # slug-derived; DeepSeek's own model page has not been checked
source = "live probe 2026-08-16: cline.exe -m cline-pass/deepseek-v4-flash resolves"
last_verified = 2026-08-18

[engines.cline.models."deepseek/deepseek-v4-flash"]
# THE FREE ROUTE UNDER THE OLD ENGINE KEY. Cline Free and Cline Pass are two
# budgets that COEXIST - free was never superseded by the pass - but before the
# cline-free engine key existed, a run took the free route by forcing the
# prefixed slug through this one. Those rows are still in the log, and they
# cost free-tier quota, not pass balance. Registering the override here is what
# keeps the API/Plan column honest about them; the engine-level value cannot,
# because this engine key served both budgets.
display = "DeepSeek V4 Flash"
lab = "DeepSeek"
access = "Cline free tier"
confidence = "unverified"
source = "observed 2026-08-15: this route hit the free tier's daily cap mid-run"
last_verified = 2026-08-18

[engines.cline-free]
harness = "Cline CLI"
access = "Cline free tier"       # operator-confirmed 2026-08-18; hard daily quota
default_model_key = "deepseek/deepseek-v4-flash"

[engines.cline-free.models."deepseek/deepseek-v4-flash"]
display = "DeepSeek V4 Flash"
lab = "DeepSeek"
confidence = "unverified"
source = "prefixed slug forces the free route; proven 2026-08-15 when it overrode an app set to cline-pass"
last_verified = 2026-08-18

[engines.cline-glm]
harness = "Cline CLI"
access = "BytePlus ARK Lite"     # operator-confirmed 2026-08-18; Lite package
default_model_key = "glm-5.2"

[engines.cline-glm.models."glm-5.2"]
# The bare id carries no provider prefix, so the ROUTE is established by the
# lane's own provider store rather than by the id. Verified on the live lane:
# ~/.cline-oe/cline-glm/sessions records provider='openai-compatible',
# model='glm-5.2', and that provider's baseUrl is BytePlus ARK ap-southeast.
display = "GLM 5.2"
lab = "Z.ai (Zhipu AI)"
confidence = "unverified"   # the lab is this registry's own verified identity for GLM 5.2, but that BytePlus's `glm-5.2` IS that model has not been confirmed at source
source = "~/.cline/data/settings/models.json: openai-compatible baseUrl https://ark.ap-southeast.bytepluses.com/api/coding/v3, defaultModelId glm-5.2"
last_verified = 2026-08-18

[engines.cline-qwen-cloud]
# THE FOURTH CLINE ROUTE, and the first that is neither a Cline-billed budget
# nor a local GPU: qwen3.7-max on the operator's own Alibaba MaaS token plan,
# reached through the same Cline CLI with `-P openai-compatible`.
#
# IT SHARES THAT PROVIDER FLAG WITH cline-glm AND POINTS SOMEWHERE ELSE. Each
# lane seeds its OWN provider store, and cline resolves -P against its provider
# id rather than the store key, so there is exactly one openai-compatible slot
# per store and the two endpoints cannot coexist in one file. If that isolation
# regresses this lane talks to BytePlus and spends the wrong plan while nothing
# errors - which is exactly why `access` has to name the PLAN and not the flag.
harness = "Cline CLI"
access = "Alibaba MaaS token plan"   # operator-confirmed 2026-08-20; a token plan, not a subscription
default_model_key = "qwen3.7-max"

[engines.cline-qwen-cloud.models."qwen3.7-max"]
display = "Qwen3.7 Max"
lab = "Alibaba"
confidence = "unverified"   # slug-derived; Alibaba's own model page has not been checked, so this is not promoted
source = "lane session store ~/.cline-oe/cline-qwen-cloud/1/sessions/*/*.json records model='qwen3.7-max' with provider='openai-compatible', read 2026-08-20"
last_verified = 2026-08-20

[engines.cline-qwen-local]
# The same Cline runtime pointed at this box's own GPUs via llama.cpp/llama-swap
# (`-P openai-compatible`, http://127.0.0.1:8090/v1 - see oe-tick.ps1's
# $LaneProviderSources), so it is metered by nothing and bounded by the GPU
# rather than a quota. Moved off Ollama's native provider 2026-08-25; the GGUF
# weights are unchanged (hardlinked from the same Ollama blob store, no
# re-download), only the serving stack and the id below changed.
#
# SAME WEIGHTS AS [engines.copilot-qwen] BELOW - one GGUF blob, two harnesses
# that have driven it (copilot-qwen still talks to it through Ollama's own
# provider and keeps that tag) - so that entry's provenance covers this one and
# is cited unchanged rather than re-derived. Only the harness and serving stack
# differ, which is the column/id that exists to say so. Do not fork the
# identity into a second slug.
harness = "Cline CLI"
access = "Local (llama.cpp/llama-swap, unmetered)"
default_model_key = "qwen38-agent-iq4-96k"

# NO ":latest" SUFFIX, UNLIKE copilot-qwen BELOW. This lane moved off Ollama
# tags onto llama.cpp/llama-swap 2026-08-25 (oe-heartbeat.ps1's $clineModels
# reports the bare id with no suffix); copilot-qwen still runs the real
# Ollama tag and keeps it. Renamed to carry the context window (-96k) in the
# id itself 2026-08-28, matching the muse-local rename below - both lanes
# actually serve 98304 (96k) via llama-swap's config.yaml, not the 64k this
# key/display previously implied.
[engines.cline-qwen-local.models."qwen38-agent-iq4-96k"]
display = "Qwen3.8 27B (agent IQ4 96k)"
lab = "Alibaba"
confidence = "verified"     # same local Ollama tag as copilot-qwen; provenance checked on box, not re-derived here
source = "ollama /api/tags parent_model=qwen3.8:27b; registry manifest batiai/qwen3.8-27b:iq4 = 15.08 GB, probed 2026-08-19"
last_verified = 2026-08-19

[engines.cline-muse-local]
# REGISTERED BEFORE ITS FIRST ROW, deliberately. The lane is configured and
# currently parked by hand (held to 2026-08-27 while cline-qwen-local proves
# the num_ctx fix), so its first run would otherwise land as an unregistered
# slug and need this whole pass again. Same model as [engines.copilot-muse];
# that entry's source is cited unchanged, for the same reason as above.
harness = "Cline CLI"
access = "Local (llama.cpp/llama-swap, unmetered)"
default_model_key = "muse-glimmer-agent-96k"

# NO ":latest" SUFFIX, UNLIKE copilot-muse BELOW - see the matching comment on
# cline-qwen-local above; same migration, same reason. Renamed 2026-08-28 to
# carry the context window (-96k) in the id: llama-swap's config.yaml has
# always served this model at 98304 (96k), the "64k" the old id/display
# implied was stale from before the Ollama->llama.cpp move.
[engines.cline-muse-local.models."muse-glimmer-agent-96k"]
display = "Muse Glimmer 30B (agent 96k)"
lab = "Meta"
confidence = "verified"     # same local Ollama tag as copilot-muse
source = "https://developer.meta.com/ai/lp/muse-glimmer/ - Meta, 30B params, Apache 2.0, an open model built for always-on local agents; this entry is a local build from the library/muse-glimmer weights blob sha256-71b5c9c9 with the vision projector omitted"
last_verified = 2026-08-19

[engines.copilot]
# NO MODELS BLOCK, DELIBERATELY. A free-plan account can only use `auto`, which
# picks per request, and copilot's output self-reports no model - so no single
# id is true and the lane is unattributable by design. Its rows resolve through
# this engine block alone, which is enough to fill Harness and API/Plan without
# inventing a model identity. Do not "fix" this by guessing a slug.
harness = "GitHub Copilot CLI"
access = "Copilot free plan"     # operator-confirmed; live probe 2026-08-15 refused reasoning effort on `auto`, which only the free plan forces

# --- LOCAL LANES -------------------------------------------------------------
# THE MIRROR IMAGE OF [engines.copilot] ABOVE, AND ITS COMMENT STILL STANDS.
# That lane is unattributable because free-plan `auto` picks per request; these
# are attributable because BYOK cannot start without an explicit model - the CLI
# exits "BYOK providers require an explicit model" (observed 2026-08-19). The
# model reaches Ringer through `--model {model}` in the args_template, which
# effective_model_from_command() reads back. So a models block here is correct
# and a models block there is still not.
#
# TWO ENGINES FOR TWO MODELS, on purpose. The Open Engine lane name IS the
# engine key, and a ticket picks its lane from its title's second bracket, so
# routing and reporting are one problem: a single local engine could only run
# its own default and every row would be credited to that one model.
#
# Access is not a plan - these run on the operator's own GPUs. Kept distinct
# from "unknown" so a blank Access cell still reads as a missing entry.

[engines.copilot-muse]
harness = "Copilot CLI (BYOK -> local Ollama)"
access = "Local (Ollama, unmetered)"
default_model_key = "muse-glimmer-agent-64k:latest"

[engines.copilot-muse.models."muse-glimmer-agent-64k:latest"]
display = "Muse Glimmer 30B (agent 64k)"
# WAS "(unknown)" UNTIL THE OPERATOR SUPPLIED THE SOURCE, and why it was unknown
# is worth keeping. The Ollama tag carries no publisher metadata whatsoever and
# the family string is just "muse-glimmer"; the only signal available locally
# was its sampling defaults (temp 1, top_k 64, top_p 0.95), which RESEMBLE
# Gemma's. Attributing off that would have recorded Google - confidently, and
# wrongly. A resemblance is not a provenance.
#
# 30B is the publisher's figure and matches the parent tag muse-glimmer:30b.
# Ollama reports parameter_size 27.9B for this quant; the two are the same model
# counted differently, not a discrepancy to chase.
lab = "Meta"
confidence = "verified"
source = "https://developer.meta.com/ai/lp/muse-glimmer/ - Meta, 30B params, Apache 2.0, an open model built for always-on local agents; this entry is a local build from the library/muse-glimmer weights blob sha256-71b5c9c9 with the vision projector omitted"
last_verified = 2026-08-19

[engines.copilot-qwen]
harness = "Copilot CLI (BYOK -> local Ollama)"
access = "Local (Ollama, unmetered)"
default_model_key = "qwen38-agent-iq4:latest"

[engines.copilot-qwen.models."qwen38-agent-iq4:latest"]
display = "Qwen3.8 27B (agent IQ4 64k)"
lab = "Alibaba"
confidence = "verified"     # provenance checked on box: batiai/qwen3.8-27b:iq4 -> parent qwen3.8:27b
source = "ollama /api/tags parent_model=qwen3.8:27b; registry manifest batiai/qwen3.8-27b:iq4 = 15.08 GB, probed 2026-08-19"
last_verified = 2026-08-19
